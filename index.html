*{box-sizing:border-box;margin:0;padding:0;}

.app{min-height:100vh;display:flex;flex-direction:column;}
.bar{background:var(--dk);height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:var(--fd);font-size:28px;letter-spacing:2px;color:var(--acc);}
.logo span{color:#fff;}
.tr{display:flex;align-items:center;gap:12px;}
.vt{display:flex;background:rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;}

.vt button.on{background:var(--acc);color:var(--dk);}

.sbi{padding:16px;}

.con > *{position:relative;z-index:1;}
.tabs{display:flex;gap:4px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:4px;margin-bottom:24px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tb{padding:8px 18px;border:none;border-radius:var(--rs);background:transparent;font-family:var(--fb);font-size:14px;font-weight:500;color:var(--t2);cursor:pointer;}
.tb.on{background:var(--dk);color:#fff;}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:16px;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.ct{font-family:var(--fd);font-size:20px;letter-spacing:1px;}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.sc{background:var(--sur2);border-radius:var(--r);padding:14px;text-align:center;}
.sv{font-family:var(--fd);font-size:26px;letter-spacing:1px;color:var(--acc);line-height:1;margin-bottom:4px;}
.sl{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);}
.sd{font-size:12px;font-weight:600;margin-top:4px;}
.sd.pos{color:var(--grn);}
.sd.neg{color:var(--red);}
.wc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.wh{background:var(--dk);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.wt{font-family:var(--fd);font-size:18px;letter-spacing:1px;color:var(--acc);}
.wm{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px;}
.er{display:grid;grid-template-columns:1fr 70px 70px 90px 90px;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bdr);align-items:center;font-size:14px;}
.er.hdr{background:var(--sur2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--t3);padding:8px 16px;}
.en{font-weight:500;display:flex;align-items:center;gap:6px;}
.pb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#FF0000;color:white;font-size:10px;text-decoration:none;flex-shrink:0;line-height:1;}
.li{width:100%;padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-family:var(--fb);font-size:13px;background:var(--bg);color:var(--t);text-align:center;}
.li:focus{outline:none;border-color:var(--acc);}
.li.ok{background:rgba(169,112,255,0.15);border-color:var(--acc);}
.btn{padding:10px 20px;border-radius:var(--rs);border:none;font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.bp{background:var(--acc);color:var(--dk);}
.bp:hover{background:#8A4FE0;}
.bd{background:var(--dk);color:#fff;}
.bg{background:transparent;color:var(--t2);border:1px solid var(--bdr);}
.bg:hover{background:var(--sur2);}
.bs{padding:6px 12px;font-size:12px;}
.dr{color:var(--red);}
.fg{margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--t2);margin-bottom:6px;display:block;}
.fi{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:var(--rs);font-family:var(--fb);font-size:14px;background:var(--sur);color:var(--t);}
.fi:focus{outline:none;border-color:var(--acc);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.mo{background:var(--sur);border-radius:var(--r);padding:28px;width:100%;max-width:780px;max-height:90vh;overflow-y:auto;}
.mt{font-family:var(--fd);font-size:24px;letter-spacing:1px;margin-bottom:20px;}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.tag{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;}
.tg{background:rgba(46,204,113,0.15);color:var(--grn);}
.ty{background:rgba(169,112,255,0.25);color:#D9BAFF;}
.emp{text-align:center;padding:48px 24px;color:var(--t3);}
.ei{font-size:40px;margin-bottom:12px;}
.et{font-family:var(--fd);font-size:22px;letter-spacing:1px;color:var(--t2);margin-bottom:6px;}
.es{font-size:14px;}

function curYM(){var d=new Date();return{y:d.getFullYear(),m:d.getMonth()};}
function prevYM(y,m){m--;if(m<0){m=11;y--;}return{y:y,m:m};}
function monthDays(y,m){var days=[];var d=new Date(y,m,1);while(d.getMonth()===m){days.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}return days;}
function wmIsCurrent(){var now=curYM();return S.wm.y===now.y&&S.wm.m===now.m;}
function wmDays(){var days=monthDays(S.wm.y,S.wm.m);if(wmIsCurrent()){var t=td();days=days.filter(function(d){return d<=t;});}return days;}
function wmLabel(){var names=["January","February","March","April","May","June","July","August","September","October","November","December"];return names[S.wm.m]+" "+S.wm.y;}
function wmPrev(){S.wm=prevYM(S.wm.y,S.wm.m);render();}
function wmNext(){if(wmIsCurrent())return;S.wm.m++;if(S.wm.m>11){S.wm.m=0;S.wm.y++;}render();}
function wmTotal(days,log){return days.reduce(function(s,d){return s+(log[d]||0);},0);}
function wmDaysLogged(days,log){return days.filter(function(d){return !!log[d];}).length;}
function wmAvg(days,log){var dl=wmDaysLogged(days,log);return dl?Math.round(wmTotal(days,log)/dl):0;}
function wmLastLabel(log){var days=wmDays();var logged=days.filter(function(d){return !!log[d];});if(!logged.length)return "No logs yet";var last=logged[logged.length-1];if(last===td())return "Today";var y=new Date();y.setDate(y.getDate()-1);if(last===y.toISOString().slice(0,10))return "Yesterday";return new Date(last).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function wmTrail(days,log){return '<div class="trl" style="flex-wrap:wrap">'+days.map(function(d){return '<span class="td'+(log[d]?' on':'')+'" title="'+d+'"></span>';}).join('')+'</div>';}
function wmNavHtml(){return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="btn bg bs" onclick="wmPrev()">&larr;</button><div style="font-family:var(--fd);font-size:18px;letter-spacing:1px;min-width:150px;text-align:center">'+wmLabel()+'</div><button class="btn bg bs" onclick="wmNext()"'+(wmIsCurrent()?' disabled style="opacity:0.3;cursor:default"':'')+'>&rarr;</button></div>';}
function wmDeltaHtml(curTotal,prevTotal){

      return '<div class="card"><div class="st" style="margin-bottom:12px">Your Goal</div>'+goalQA(latest)+'<button class="btn bp" style="margin-top:8px" onclick="gNext(\''+cid+'\',\'behavior\')">Start a new check-in</button>'
    }
    return '<div class="card"><div class="st">Goal Setting</div><p style="font-size:14px;color:var(--t2);margin-bottom:16px;line-height:1.6;">Two minutes to check in on where you are at and set your next goal.</p><button class="btn bp" onclick="gNext(\''+cid+'\',\'behavior\')">Let\'s go</button></div>';
  }
  if(g.step==="behavior"){
    return '<div class="card"><div class="st">What is one habit or goal you are working on right now?</div><div class="fg"><input class="fi" id="gb" placeholder="e.g., strength training twice a week" value="'+esc(g.behavior)+'"></div><button class="btn bp" onclick="gSetBehavior(\''+cid+'\')">Continue</button></div>';
  }
  if(g.step==="q1")return gQuestion("Are you already doing this pretty consistently?","gAnswerConsistent",cid);
  if(g.step==="q1b")return gQuestion("Have you been doing it consistently for 6 months or more?","gAnswerSixMonths",cid);
  if(g.step==="q2")return gQuestion("Are you planning to start in the next 30 days?","gAnswerNext30",cid);
  if(g.step==="q3")return gQuestion("Do you think you'll start sometime in the next 6 months?","gAnswerNext6",cid);
  if(g.step==="goal1"||g.step==="goal2"||g.step==="goal3"){
    var copy=STAGE_COPY[g.stageId];
    var map={goal1:{key:"specific",label:copy.specific,ph:copy.specificPh,next:"goal2"},goal2:{key:"measurable",label:copy.measurable,ph:copy.measurablePh,next:"goal3"},goal3:{key:"motivation",label:copy.motivation,ph:copy.motivationPh,next:"goal4"}};
    var m=map[g.step];
    return '<div class="card"><div class="st">'+m.label+'</div><div class="fg"><textarea class="fi" id="gf" placeholder="'+m.ph+'" style="min-height:80px;resize:vertical;line-height:1.5;">'+esc(g.draft[m.key])+'</textarea></div><button class="btn bp" onclick="gSetField(\''+cid+'\',\''+m.key+'\',\''+m.next+'\')">Continue</button></div>';
  }
  if(g.step==="goal4"){
    return '<div class="card"><div class="st">By when?</div><div class="fg"><input class="fi" type="date" id="gf" value="'+esc(g.draft.timeframe)+'"></div><button class="btn bp" onclick="gSetTimeframe(\''+cid+'\')">Review</button></div>';
  }
  if(g.step==="review"){
    var stmt='By '+(g.draft.timeframe||'soon')+', you will '+g.draft.specific+'. Tracked by: '+g.draft.measurable+'. Why it matters: '+g.draft.motivation+'.';
    return '<div class="card"><div class="st">Here is your goal</div><p style="font-size:14px;line-height:1.6;background:var(--sur2);padding:14px;border-radius:var(--rs);margin-bottom:16px;display:block;width:100%;box-sizing:border-box;word-break:break-word;">'+esc(stmt)+'</p><button class="btn bp" onclick="gSubmit(\''+cid+'\')">Looks good, send it</button></div>';
  }
  if(g.step==="done"){
    var mine=(DB.checkins[cid]||[]).slice().reverse();
    var hist=mine.length?mine.map(function(e){return '<div style="padding:10px 0;border-bottom:1px solid var(--bdr)"><div style="font-size:11px;color:var(--t3);margin-bottom:4px">'+fmtN(e.created_at)+'</div><div style="font-size:13px">'+esc(e.goal_statement)+'</div></div>';}).join(''):'';
    return '<div class="card"><div class="st">&#10003; Thanks!</div><p style="font-size:14px;color:var(--t2);margin-bottom:16px">Your check-in is in. Your trainer will follow up with you on this soon.</p><button class="btn bg bs" onclick="gReset(\''+cid+'\')">Start a new check-in</button></div>'+(hist?'<div class="card"><div class="st" style="font-size:16px">Past Check-Ins</div>'+hist+'</div>':'');
  }
  return '';
}
function gNext(cid,step){S.goal.step=step;render();}
function gSetBehavior(cid){var el=document.getElementById("gb");if(!el||!el.value.trim())return;S.goal.behavior=el.value.trim();S.goal.step="q1";render();}
function gAnswerConsistent(cid,val){S.goal.step=val?"q1b":"q2";render();}
function gAnswerSixMonths(cid,val){S.goal.stageId=val?"maintenance":"action";S.goal.step="goal1";render();}
function gAnswerNext30(cid,val){if(val){S.goal.stageId="preparation";S.goal.step="goal1";}else{S.goal.step="q3";}render();}
function gAnswerNext6(cid,val){S.goal.stageId=val?"contemplation":"precontemplation";S.goal.step="goal1";render();}
function gSetField(cid,key,next){var el=document.getElementById("gf");if(!el||!el.value.trim())return;S.goal.draft[key]=el.value.trim();S.goal.step=next;render();}
function gSetTimeframe(cid){var el=document.getElementById("gf");if(!el||!el.value)return;S.goal.draft.timeframe=el.value;S.goal.step="review";render();}
function gReset(cid){S.goal={step:"intro",behavior:"",stageId:null,draft:{specific:"",measurable:"",timeframe:"",motivation:""}};render();}
function gSubmit(cid){
  var g=S.goal;
  var stmt='By '+(g.draft.timeframe||'soon')+', I will '+g.draft.specific+'. Tracked by: '+g.draft.measurable+'. Why it matters: '+g.draft.motivation+'.';
  sb.from("checkins").insert({client_id:cid,behavior:g.behavior,stage_id:g.stageId,goal_specific:g.draft.specific,goal_measurable:g.draft.measurable,goal_timeframe:g.draft.timeframe||null,goal_motivation:g.draft.motivation,goal_statement:stmt}).select().single().then(function(r){
    if(r.error){alert(r.error.message);return;}
    if(!DB.checkins[cid])DB.checkins[cid]=[];
    if(r.data)DB.checkins[cid].push(r.data);
    S.goal.step="done";
    render();
  });
}
function setV(v){S.view=v;render();}
function setT(t){S.tab=t;if(t==="notes"&&S.sel){if(!S.seenNotes)S.seenNotes={};S.seenNotes[S.sel]=true;}render();}
function selC(id){S.sel=id;S.tab="workouts";render();}
function hasUnreadNote(cid){if(S.seenNotes&&S.seenNotes[cid])return false;var notes=DB.notes[cid]||[];return notes.some(function(n){return n.author==="client";});}
function openM(type,cid,wid){S.modal={type:type,cid:cid,wid:wid};render();}
function closeM(){S.modal=null;render();}
function doAC(){var name=document.getElementById("mn").value.trim();if(!name)return;sb.from("clients").insert({name:name,email:document.getElementById("me").value,goal:document.getElementById("mg").value,token:tok(name)}).select().single().then(function(r){if(r.error){alert(r.error.message);return;}DB.clients.push(r.data);S.sel=r.data.id;closeM();});}
function logS(cid,wid){var data={};document.querySelectorAll('input[data-wid="'+wid+'"]').forEach(function(el){if(el.value)data[el.dataset.idx+"_a"]=el.value;});var tday=td();var existing=(DB.logs[cid]&&DB.logs[cid][wid]||[]).find(function(l){return l.date===tday;});var p=existing?sb.from("logs").update({data:data}).eq("id",existing.id).then(function(){existing.data=data;}):sb.from("logs").insert({client_id:cid,workout_id:wid,date:tday,data:data}).select().single().then(function(r){if(!DB.logs[cid])DB.logs[cid]={};if(!DB.logs[cid][wid])DB.logs[cid][wid]=[];if(r.data)DB.logs[cid][wid].push(r.data);});p.then(function(){var b=document.getElementById("sv"+wid);if(b){b.classList.remove("hide");setTimeout(function(){b.classList.add("hide");},2500);}});}
function doSW(cid,eid){
  var name=document.getElementById("wn").value.trim();
  if(!name){alert("Please enter a workout name.");return;}
  var exercises=Array.from(document.querySelectorAll("#exl .ebr")).map(function(r){return{name:r.querySelector("[data-f=name]").value,sets:r.querySelector("[data-f=sets]").value,reps:r.querySelector("[data-f=reps]").value,weight:r.querySelector("[data-f=weight]").value,rest:r.querySelector("[data-f=rest]").value,url:r.querySelector("[data-f=url]")?r.querySelector("[data-f=url]").value:"",cue:r.querySelector("[data-f=cue]")?r.querySelector("[data-f=cue]").value:""};}).filter(function(e){return e.name.trim();});
  var day=document.getElementById("wd").value;
  var isEdit=eid&&eid.length>0;
  var p=isEdit
    ?sb.from("workouts").update({name:name,day:day,exercises:exercises}).eq("id",eid).select().single().then(function(r){if(r.error){alert("Error saving: "+r.error.message);return;}if(r.data){if(!DB.workouts[cid])DB.workouts[cid]=[];DB.workouts[cid]=DB.workouts[cid].map(function(w){return w.id===eid?r.data:w;});}})
    :sb.from("workouts").insert({client_id:cid,name:name,day:day,exercises:exercises}).select().single().then(function(r){if(r.error){alert("Error saving: "+r.error.message);return;}if(!DB.workouts[cid])DB.workouts[cid]=[];if(r.data)DB.workouts[cid].unshift(r.data);});
  p.then(function(){closeM();});
}
function delW(id,cid){if(!confirm("Delete this workout?"))return;sb.from("workouts").delete().eq("id",id).then(function(){DB.workouts[cid]=(DB.workouts[cid]||[]).filter(function(w){return w.id!==id;});render();});}
function addExR(){var list=document.getElementById("exl");list.insertAdjacentHTML("beforeend",exR({},list.children.length));}
function remExR(i){var el=document.getElementById("ex"+i);if(el)el.remove();}
function doSE(cid){var fields=["body_fat","muscle_mass","bmr","hydration","visceral_fat","weight"];var entry={date:document.getElementById("ev_date").value,client_id:cid};fields.forEach(function(f){var el=document.getElementById("ev_"+f);if(el&&el.value)entry[f]=parseFloat(el.value);});sb.from("evolt").insert(entry).select().single().then(function(r){if(r.error){alert(r.error.message);return;}if(!DB.evolt[cid])DB.evolt[cid]=[];if(r.data)DB.evolt[cid].push(r.data);closeM();});}
function cpLink(link){navigator.clipboard.writeText(link).then(function(){var btn=document.querySelector(".lb .btn");if(btn){var orig=btn.textContent;btn.textContent="Copied!";setTimeout(function(){btn.textContent=orig;},2000);}});}
function expD(){var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="fitcoach-"+td()+".json";a.click();URL.revokeObjectURL(url);}
loadAll().then(function(){render();});
</script>
</body>
